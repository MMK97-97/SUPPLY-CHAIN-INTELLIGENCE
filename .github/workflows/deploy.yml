# Publish one verified static build to GitHub Pages.
name: Deploy Supply Chain Intelligence to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: node build-cloudflare.mjs

      - name: Validate static site
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { existsSync, statSync } from 'node:fs';
          const required = [
            'index.html', 'business-operations.html', 'login.html',
            'data-center.html', 'assets/system-core.js',
            'assets/system-seed.js', 'assets/system-shell.js',
            'assets/system-pages.js', 'assets/system-connectors.js',
            'assets/system-cloud.js', 'assets/unified-system.css',
            'crm/index.html', 'order-management/new-order.html',
            'vendor-po-management.html', 'warehouse-management/receiving.html',
            'warehouse-management/packing-dispatch.html',
            '3pl-management/shipments.html'
          ];
          for (const file of required) {
            const path = `dist/${file}`;
            if (!existsSync(path) || !statSync(path).isFile() || statSync(path).size === 0) {
              throw new Error(`Missing or empty site file: ${path}. Copy the project contents into the repository root.`);
            }
          }
          console.log(`Verified ${required.length} essential pages and assets in dist/.`);
          NODE

      - name: Upload GitHub Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./dist
          retention-days: 7

      - name: Wait for GitHub Pages artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::The Pages upload did not return an artifact ID.'
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if pages_artifact_ready="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"github-pages\" and .expired == false)] | length == 1 and .[0].id == ${PAGES_ARTIFACT_ID}")" \
              && [[ "$pages_artifact_ready" == true ]]; then
              echo 'GitHub can see the uploaded github-pages artifact for this workflow run.'
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo '::error::GitHub cannot see exactly one current github-pages artifact. Start a new full workflow run after GitHub recovers.'
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
