name: Deploy Supabase Functions

on:
  push:
    paths:
      - "supabase/functions/send-sandbox-email/**"
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check deployment configuration
        id: config
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase deployment skipped: SUPABASE_ACCESS_TOKEN is not configured."
          fi

      - name: Checkout repository
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        if: steps.config.outputs.configured == 'true'
        uses: supabase/setup-cli@v3.2.0
        with:
          version: latest

      - name: Deploy send-sandbox-email
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: cbvkxqokqsuwywkpzvuq
        run: supabase functions deploy send-sandbox-email --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
