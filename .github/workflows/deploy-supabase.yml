name: Deploy Supabase Functions

on:
  push:
    paths:
      - "supabase/functions/**"
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: env.SUPABASE_ACCESS_TOKEN != ''
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: cbvkxqokqsuwywkpzvuq
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy send-sandbox-email
        run: supabase functions deploy send-sandbox-email --project-ref $SUPABASE_PROJECT_ID --no-verify-jwt
