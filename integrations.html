<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Operations workspace · MK97 ERP</title>
  <script>
    const target = new URL('workspace.html', location.href);
    const source = new URLSearchParams(location.search);
    for (const key of ['demo','region']) if (source.has(key)) target.searchParams.set(key,source.get(key));
    target.searchParams.set('view','operations');
    location.replace(target.href);
  </script>
</head>
<body>
  <main><h1>Operations workspace</h1><p>Use the workspace for procurement, stock coverage and operational exceptions.</p><p><a href="workspace.html?view=operations">Open Operations</a></p></main>
</body>
</html>
